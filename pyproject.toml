[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.9.26,<0.10" ]

[project]
name = "smk"
version = "3.0.0-dev"
description = "Spacelift Migration Kit"
readme = "README.md"
authors = [ { name = "Spacelift", email = "contact@spacelift.io" } ]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.128.1",
  "jinja2>=3.1.6",
  "pluggy>=1.6",
  "pydantic-settings>=2.12",
  "pytailwindcss>=0.2",
  "python-multipart>=0.0.22",
  "pyyaml>=6.0.3",
  "typer>=0.21.1",
  "uvicorn[standard]>=0.40",
  "xdg-base-dirs>=6.0.2",
]

optional-dependencies.desktop = [ "pywebview>=5.3" ]
scripts.smk = "smk.core.cli:app"

[dependency-groups]
dev = [
  "arel==0.4.*",
  "httpx>=0.28.1",
  "mdformat>=1",
  "mdformat-frontmatter>=2.0.10",
  "pre-commit>=4.5.1",
  "pyinstaller>=6.18",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7",
  "pytest-mock>=3.15.1",
  "ruff>=0.14.14",
  "ty>=0.0.13",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [ "docs/plugins/examples" ]
lint.select = [
  "A",   # flake8-builtins
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "PTH", # flake8-use-pathlib
  "RUF", # Ruff-specific rules
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "T20", # flake8-print
  "TCH", # flake8-type-checking
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [  ]
lint.per-file-ignores."tests/**/*.py" = [
  "S101", # assert is allowed in tests
  "S105", # hardcoded passwords are fine in tests
  "S106", # hardcoded password arguments are fine in tests
]
lint.isort.known-first-party = [ "smk" ]

[tool.pyproject-fmt]
column_width = 120
max_supported_python = "3.14"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = "--strict-markers"

[tool.coverage.run]
source = [ "src/smk" ]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
show_missing = true

[tool.deadcode]
exclude = [ "tests" ]
