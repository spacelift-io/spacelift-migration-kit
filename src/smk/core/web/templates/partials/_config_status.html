{% if config_initialized %}
<div class="flex items-center">
  <span class="inline-block w-3 h-3 bg-green-500 rounded-full mr-2"></span>
  <span class="text-green-700 dark:text-green-400">Configuration initialized</span>
</div>
<p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
  Config file: <code class="bg-gray-100 dark:bg-gray-700 px-1 rounded text-xs">{{ config_file }}</code>
</p>
{% else %}
<div class="flex items-center">
  <span class="inline-block w-3 h-3 bg-yellow-500 rounded-full mr-2"></span>
  <span class="text-yellow-700 dark:text-yellow-400">Not initialized</span>
</div>
<p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
  Run <code class="bg-gray-100 dark:bg-gray-700 px-1 rounded text-xs">smk config init</code> to get started.
</p>
{% endif %}
