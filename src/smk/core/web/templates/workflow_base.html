<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Migration Workflow{% endblock %} - Spacelift Migration Kit</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-50">
  <!-- Header -->
  <nav class="bg-white border-b border-gray-200 fixed w-full z-30 top-0">
    <div class="px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <svg class="w-10 h-10" viewBox="0 0 76.56 65.65" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="c" x1="0" y1="354.36" x2="76.56" y2="354.36" gradientTransform="translate(-56.41 367.21) rotate(9.24) scale(1 -1)" gradientUnits="userSpaceOnUse">
                <stop offset=".08" stop-color="#82ffe8"/>
                <stop offset=".95" stop-color="#7c47fc"/>
              </linearGradient>
            </defs>
            <path fill="#131417" d="M64.61,34.81c-.82,6.24-3.33,9.96-6.89,10.22-2.44,.02-4.75-1.11-6.24-3.04,5.31-3.73,8.8-9.52,9.64-15.96-14.21,4.23-28.91,6.61-43.73,7.07,1.72,3.56,4.33,6.63,7.57,8.9-5.7,6.55-8.77,14.99-8.59,23.67h5.99c-.14-6.76,2.06-13.36,6.23-18.67-.9,6.19-1.46,12.42-1.69,18.67h10.63s-1.95-8.06,1.23-8.07c3.18,0,1.22,8.07,1.22,8.07h10.64c-.21-5.9-.73-11.79-1.55-17.65,1.18,.95,2.51,1.71,3.94,2.24,1.64,.61,3.38,.87,5.13,.75,3.17-.24,6.11-1.78,8.09-4.27,2.24-2.67,3.69-6.42,4.31-11.14l-5.94-.78Z"/>
            <ellipse fill="url(#c)" cx="38.28" cy="23.6" rx="38.75" ry="9.45" transform="translate(-3.29 6.45) rotate(-9.24)"/>
            <path fill="#131417" d="M59.03,13.08C53.49,1.58,39.68-3.24,28.18,2.3c-9.2,4.44-14.4,14.39-12.78,24.47,1.11,6.89,46.79-.16,45.62-7.38-.36-2.19-1.03-4.32-1.99-6.32Z"/>
          </svg>
          <span class="ml-3 text-xl font-semibold text-gray-900">Spacelift Migration Kit</span>
        </div>
        <div class="flex items-center space-x-6">
          <a href="#" class="text-gray-700 hover:text-spacelift-yellow font-medium">Data</a>
          <a href="#" class="text-gray-700 hover:text-spacelift-yellow font-medium">Settings</a>
          <a href="#" class="text-gray-700 hover:text-spacelift-yellow font-medium">Logs</a>
          <a href="https://docs.spacelift.io/product/migrating-to-spacelift" class="text-gray-700 hover:text-spacelift-yellow font-medium" target="_blank" rel="noopener noreferrer">Docs</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content Area with top padding for fixed header -->
  <div class="pt-20 pb-8">
    <!-- Progress Stepper -->
    <div class="max-w-7xl mx-auto px-6 py-8">
      {% from "components/_workflow_stepper.html" import stepper %}
      {{ stepper(current_step, completed_steps, workflow_steps) }}
    </div>

    <!-- Content Area -->
    <div class="max-w-7xl mx-auto px-6 mt-16">
      <div class="bg-white rounded-lg shadow-lg p-8">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
  {% if request and request.app.state.hot_reload %}
  <script>{{ request.app.state.hot_reload.script("/hot-reload") | safe }}</script>
  {% endif %}
</body>
</html>
