{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">Dashboard</h1>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
  <div class="p-4 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
    <h5 class="mb-2 text-lg font-semibold tracking-tight text-gray-900 dark:text-white">Configuration Status</h5>
    <div hx-get="/partials/config-status" hx-trigger="load" hx-swap="innerHTML">
      <div class="animate-pulse">
        <div class="h-4 bg-gray-200 rounded dark:bg-gray-700 w-3/4 mb-2"></div>
        <div class="h-4 bg-gray-200 rounded dark:bg-gray-700 w-1/2"></div>
      </div>
    </div>
  </div>

  <div class="p-4 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
    <h5 class="mb-2 text-lg font-semibold tracking-tight text-gray-900 dark:text-white">Migration Progress</h5>
    <p class="text-gray-700 dark:text-gray-400">No migration in progress.</p>
  </div>

  <div class="p-4 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
    <h5 class="mb-2 text-lg font-semibold tracking-tight text-gray-900 dark:text-white">Quick Actions</h5>
    <div class="flex flex-col gap-2">
      <a href="/config" class="text-blue-600 hover:underline dark:text-blue-500">Configure SMK</a>
    </div>
  </div>
</div>
{% endblock %}
